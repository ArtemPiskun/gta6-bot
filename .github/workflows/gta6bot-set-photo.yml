# Поставить аватарку канала из assets/brand/channel-avatar-640.jpg (Actions -> gta6bot-set-photo -> Run workflow)
name: gta6bot-set-photo
on: workflow_dispatch
jobs:
  set-photo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python -m gta6bot set-photo
