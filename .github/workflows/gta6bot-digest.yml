name: gta6bot-digest
on:
  schedule:
    - cron: "0 17 * * *"   # 20:00 МСК
  workflow_dispatch:
concurrency: { group: gta6bot, cancel-in-progress: false }
jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/cache/restore@v4
        with:
          path: data
          key: gta6bot-db-digest-${{ github.run_id }}
          restore-keys: gta6bot-db-
      - env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
        run: python -m gta6bot digest
